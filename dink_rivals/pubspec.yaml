name: dink_rivals
description: MVP release-candidate arcade pickleball game for Dink Rivals.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flame: any
  go_router: ^17.2.3
  flutter_riverpod: ^3.3.1
  shared_preferences: ^2.5.5
  flame_audio: ^2.12.1
  google_mobile_ads: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/court/
    - assets/images/environment/classic/
    - assets/images/environment/shared/
    - assets/images/sprites/
    - assets/images/ui/
    - assets/images/ui/hud/
    - assets/images/ui/court_cards/
    - assets/images/vfx/
    - assets/audio/sfx/
